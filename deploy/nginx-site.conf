# 银发 AI 互动小说 · 系统 nginx 站点配置（含 HTTPS）
server {
    listen 80;
    server_name xiaoshuo.neigeshei.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name xiaoshuo.neigeshei.com;

    ssl_certificate     /etc/letsencrypt/live/xiaoshuo.neigeshei.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xiaoshuo.neigeshei.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    root /opt/novel-app/deploy/web;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Strict-Transport-Security "max-age=31536000" always;
}
