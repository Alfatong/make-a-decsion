version: "3.9"

services:
  api:
    build: ..
    container_name: novel-api
    restart: always
    env_file: ../.env
    environment:
      - APP_ENV=prod
      - DATABASE_URL=postgresql+psycopg2://novel:${POSTGRES_PASSWORD}@postgres:5432/novel
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
    depends_on:
      - postgres
      - redis
      - qdrant
    networks:
      - novel-net

  postgres:
    image: postgres:16-alpine
    container_name: novel-postgres
    restart: always
    environment:
      - POSTGRES_USER=novel
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=novel
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - novel-net

  redis:
    image: redis:7-alpine
    container_name: novel-redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    networks:
      - novel-net

  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: novel-qdrant
    restart: always
    volumes:
      - qdrantdata:/qdrant/storage
    networks:
      - novel-net

  nginx:
    image: nginx:1.27-alpine
    container_name: novel-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web:/usr/share/nginx/html:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - api
    networks:
      - novel-net

volumes:
  pgdata:
  redisdata:
  qdrantdata:

networks:
  novel-net:
    driver: bridge
