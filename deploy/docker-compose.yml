version: "3.9"

services:
  api:
    build: ..
    container_name: novel-api
    restart: always
    env_file: ../.env
    ports:
      - "127.0.0.1:8081:8000"   # 对外经系统 nginx 反代（80/443 被占用，故仅本机回环）
    volumes:
      - ./web:/opt/novel-app/deploy/web   # 音频/静态写入宿主机 web，供系统 nginx 托管
    environment:
      - APP_ENV=prod
      - DATABASE_URL=postgresql+psycopg2://novel:${POSTGRES_PASSWORD}@postgres:5432/novel
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
    depends_on:
      - postgres
      - redis
      - qdrant
    networks:
      - novel-net

  postgres:
    image: postgres:16-alpine
    container_name: novel-postgres
    restart: always
    environment:
      - POSTGRES_USER=novel
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=novel
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - novel-net

  redis:
    image: redis:7-alpine
    container_name: novel-redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    networks:
      - novel-net

  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: novel-qdrant
    restart: always
    volumes:
      - qdrantdata:/qdrant/storage
    networks:
      - novel-net

  # 注意：80/443 已被服务器现有系统 nginx 占用，本栈不再起 nginx 容器。
  # 前端静态与反向代理由系统 nginx（/etc/nginx/sites-enabled/xiaoshuo）承担，
  # 将 xiaoshuo.neigeshei.com 反代到本栈 api 的 127.0.0.1:8081。

volumes:
  pgdata:
  redisdata:
  qdrantdata:

networks:
  novel-net:
    driver: bridge
