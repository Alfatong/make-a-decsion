<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>银发 AI 互动小说</title>
<style>
  :root {
    --bg: #FBF7F0; --bg2: #F4EDE1; --ink: #2E2A25; --muted: #7C7266;
    --accent: #B3541E; --accent2: #3F6C51; --hl: #FFE9B0; --rule: #E3D9C8;
    --fs: 22px; /* 适老大字号 */
    --lh: 2.0;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { -webkit-text-size-adjust:100%; text-size-adjust:100%; }
  body { background:var(--bg); color:var(--ink); font-family:"PingFang SC","Microsoft YaHei",sans-serif; font-size:var(--fs); line-height:var(--lh); }
  .wrap { max-width:760px; margin:0 auto; padding:0 18px 160px; }
  header.top { position:sticky; top:0; background:var(--bg); border-bottom:1px solid var(--rule); padding:14px 18px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px; z-index:10; }
  header.top .t { font-size:20px; font-weight:700; }
  header.top .mode-btn { font-size:16px; background:var(--bg2); border:1px solid var(--rule); border-radius:8px; padding:6px 12px; color:var(--muted); }
  .ai-tag { display:inline-block; font-size:13px; background:var(--bg2); color:var(--muted); border:1px solid var(--rule); border-radius:99px; padding:2px 10px; margin-left:8px; vertical-align:middle; }
  h1.book { font-size:26px; margin:24px 0 6px; }
  .toc-item { padding:16px 8px; border-bottom:1px solid var(--rule); font-size:20px; cursor:pointer; overflow-wrap:break-word; }
  .toc-item:active { background:var(--bg2); }
  /* 首页书籍卡 + 开始阅读大按钮 */
  .book-card { background:#fff; border:2px solid var(--rule); border-radius:14px; padding:18px; margin-bottom:14px; }
  .book-card:active { border-color:var(--accent2); }
  .read-btn { display:block; width:100%; text-align:center; font-size:23px; font-weight:700;
              padding:18px; margin-top:12px; border-radius:12px; border:none; cursor:pointer;
              background:var(--accent2); color:#fff; }
  .read-btn:active { opacity:0.85; }
  .chapter-title { font-size:24px; font-weight:700; margin:22px 0 14px; text-align:center; }
  .para { margin-bottom:1.1em; text-align:justify; padding:2px 4px; border-radius:6px; transition:background 0.2s; }
  .para.active { background:var(--hl); }
  .interact { background:var(--bg2); border:1px solid var(--rule); border-radius:12px; padding:18px; margin:22px 0; }
  .interact .q { font-size:20px; font-weight:700; margin-bottom:12px; color:var(--accent2); }
  .opt { display:block; width:100%; text-align:left; font-size:20px; padding:16px; margin:10px 0; background:#fff; border:2px solid var(--rule); border-radius:10px; cursor:pointer; }
  .opt:active { border-color:var(--accent2); background:#EAF3EE; }
  .resp { margin-top:14px; padding:14px; background:#fff; border-left:4px solid var(--accent2); border-radius:0 8px 8px 0; font-size:19px; }
  /* 底部控制条（大字体下可换行，不溢出） */
  .bar { position:fixed; left:0; right:0; bottom:0; background:#fff; border-top:1px solid var(--rule); padding:10px 14px calc(10px + env(safe-area-inset-bottom)); display:flex; gap:8px; align-items:center; flex-wrap:wrap; z-index:20; }
  .bar button { flex:1 1 30%; min-width:88px; font-size:19px; padding:14px 8px; border-radius:10px; border:1px solid var(--rule); background:var(--bg2); color:var(--ink); }
  .bar button.primary { background:var(--accent2); color:#fff; border-color:var(--accent2); }
  .bar button:disabled { opacity:0.4; }
  .speed { display:flex; gap:4px; flex-wrap:wrap; }
  .speed button { flex:none; font-size:15px; padding:10px 10px; min-width:0; }
  .speed button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  .loading { text-align:center; color:var(--muted); padding:60px 0; font-size:20px; }
  /* 加载遮罩（章节切换反馈） */
  .mask { position:fixed; inset:0; background:rgba(251,247,240,0.92); z-index:50; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .mask .spin { width:46px; height:46px; border:5px solid var(--rule); border-top-color:var(--accent2); border-radius:50%; animation:rot 0.9s linear infinite; }
  .mask .txt { margin-top:18px; font-size:20px; color:var(--muted); }
  @keyframes rot { to { transform:rotate(360deg); } }
  /* 锁章 / 收银台 */
  .lock-box { text-align:center; padding:50px 20px; }
  .lock-box .icon { font-size:52px; }
  .lock-box .tip { font-size:20px; color:var(--muted); margin:16px 0 24px; }
  .pay-btn { display:block; width:100%; font-size:21px; padding:16px; margin:12px 0; border-radius:12px; border:none; cursor:pointer; }
  .pay-btn.buy { background:var(--accent); color:#fff; }
  .pay-btn.ch { background:var(--bg2); color:var(--ink); border:2px solid var(--rule); }
  .cashier { position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:60; display:flex; align-items:flex-end; }
  .cashier .panel { background:#fff; width:100%; border-radius:16px 16px 0 0; padding:24px 20px calc(24px + env(safe-area-inset-bottom)); }
  .cashier .amt { font-size:34px; font-weight:700; color:var(--accent); text-align:center; margin:10px 0 20px; }
  .cashier .row { display:flex; gap:10px; }
  .err { text-align:center; color:var(--accent); padding:40px 0; font-size:19px; }
</style>
</head>
<body>
<header class="top">
  <span class="t" id="topTitle">银发 AI 互动小说</span>
  <span>
    <button class="mode-btn" id="modeBtn" onclick="toggleMode()">标准版</button>
    <button class="mode-btn" id="fontBtn">字号 A+</button>
  </span>
</header>
<div class="wrap" id="app"><div class="loading">加载中…</div></div>

<script>
const API = '/api/v1';
let state = { view:'home', book:null, chapter:null, fontSize:22, audio:null, playing:false, speed:1.0, segIdx:-1 };
const app = document.getElementById('app');

// 字号切换（适老）
document.getElementById('fontBtn').onclick = () => {
  state.fontSize = state.fontSize >= 28 ? 22 : state.fontSize + 2;
  document.documentElement.style.setProperty('--fs', state.fontSize + 'px');
};

async function api(path){ const r = await fetch(API+path); const j = await r.json(); if(j.code!==0) throw new Error(j.msg); return j.data; }
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

// 设备标识（内测期即账号）
function deviceId(){ let id=localStorage.getItem('device_id'); if(!id){ id='dev-'+Math.random().toString(36).slice(2)+Date.now().toString(36); localStorage.setItem('device_id',id);} return id; }
// 模式：拉取配置并应用
async function applyMode(){
  try{
    const d = await api('/user/mode?device_id='+deviceId());
    state.mode = d.mode; applyModeCfg(d.config);
    document.getElementById('modeBtn').textContent = d.mode==='care'?'关怀版':'标准版';
  }catch(e){}
}
function applyModeCfg(cfg){
  document.documentElement.style.setProperty('--fs', cfg.font_size+'px');
  document.documentElement.style.setProperty('--lh', cfg.line_height||2.0);
}
async function toggleMode(){
  const next = state.mode==='care'?'standard':'care';
  try{
    const resp = await fetch(API+'/user/mode',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({device_id:deviceId(),mode:next})});
    const j = await resp.json();
    if(j.code===0){ state.mode=j.data.mode; applyModeCfg(j.data.config); document.getElementById('modeBtn').textContent = next==='care'?'关怀版':'标准版'; }
  }catch(e){}
}
// 进度上报（切章时）
async function reportProgress(bookId, no, pos){
  try{ await fetch(API+'/progress',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({device_id:deviceId(),book_id:bookId,chapter_no:no,position:pos||0})}); }catch(e){}
}

// 首页
async function showHome(){
  state.view='home'; stopAudio();
  document.getElementById('topTitle').textContent='银发 AI 互动小说';
  try{
    const d = await api('/home?device_id='+deviceId());
    if(!d.books.length){ app.innerHTML='<div class="err">暂无已上架作品</div>'; return; }
    let html = `<div style="padding:14px 0"><input id="q" placeholder="搜书名 / 章节" onkeydown="if(event.key==='Enter')doSearch()" style="width:100%;font-size:19px;padding:14px;border:2px solid var(--rule);border-radius:10px;background:#fff"></div>`;
    if(d.resume){ html += `<div class="book-card" style="background:var(--hl);border-color:var(--accent)" onclick="openChapter(${d.resume.book_id},${d.resume.chapter_no})">
      <b>《${esc(d.resume.title)}》</b>
      <button class="read-btn" style="background:var(--accent)">▶ 接着读 第 ${d.resume.chapter_no} 章</button>
    </div>`; }
    if(d.featured && d.featured.length){ html += `<div style="font-size:16px;color:var(--muted);margin:6px 0">精选</div>` + d.featured.map(b=>`
      <div class="book-card" onclick="openChapter(${b.id},1)">
        <b style="font-size:22px">${esc(b.title)}</b><span class="ai-tag">AI 创作</span>
        <div style="font-size:15px;color:var(--muted)">${esc(b.theme||'')} · 共 ${b.total_chapters} 章</div>
        ${b.intro?`<div style="font-size:17px;color:var(--ink);margin-top:6px;line-height:1.7">${esc(b.intro)}</div>`:''}
        <button class="read-btn">▶ 开始阅读</button>
        <div style="text-align:center;margin-top:8px"><span style="font-size:15px;color:var(--muted)" onclick="event.stopPropagation();openBook(${b.id})">查看目录</span></div>
      </div>`).join(''); }
    html += d.books.map(b=>`
      <div class="book-card" onclick="openChapter(${b.id},1)">
        <b style="font-size:22px">${esc(b.title)}</b><span class="ai-tag">AI 创作</span>
        <div style="font-size:16px;color:var(--muted)">${esc(b.theme||'')} · 共 ${b.total_chapters} 章</div>
        <button class="read-btn">▶ 开始阅读</button>
        <div style="text-align:center;margin-top:8px"><span style="font-size:15px;color:var(--muted)" onclick="event.stopPropagation();openBook(${b.id})">查看目录</span></div>
      </div>`).join('');
    app.innerHTML = html;
  }catch(e){ app.innerHTML='<div class="err">加载失败：'+e.message+'</div>'; }
}

// 搜索
async function doSearch(){
  const q = document.getElementById('q').value.trim(); if(!q) return;
  try{
    const d = await api('/search?q='+encodeURIComponent(q));
    let html = `<div style="padding:14px 0"><input id="q" value="${esc(q)}" onkeydown="if(event.key==='Enter')doSearch()" style="width:100%;font-size:19px;padding:14px;border:2px solid var(--rule);border-radius:10px;background:#fff"></div>`;
    html += `<div style="font-size:16px;color:var(--muted)">搜索"${esc(q)}"</div>`;
    if(d.books.length) html += d.books.map(b=>`<div class="toc-item" onclick="openBook(${b.id})"><b>${esc(b.title)}</b></div>`).join('');
    if(d.chapters.length) html += d.chapters.map(c=>`<div class="toc-item" onclick="openChapter(${c.book_id},${c.no})">${esc(c.title||('第'+c.no+'章'))}</div>`).join('');
    if(!d.books.length && !d.chapters.length) html += '<div class="err">没有找到相关内容</div>';
    app.innerHTML = html;
  }catch(e){ app.innerHTML='<div class="err">搜索失败</div>'; }
}

// 作品目录
async function openBook(id){
  state.view='book'; stopAudio();
  try{
    const b = await api('/books/'+id);
    state.book=b;
    document.getElementById('topTitle').textContent=b.title;
    app.innerHTML = `<h1 class="book">${esc(b.title)}<span class="ai-tag">AI 创作</span></h1>
      <div style="color:var(--muted);font-size:16px;margin-bottom:14px">共 ${b.total_chapters} 章</div>
      ${b.toc.length?`<button class="read-btn" style="margin:0 0 16px" onclick="openChapter(${b.id},${b.toc[0].no})">▶ 开始阅读</button>`:''}
      ${b.intro?`<div style="font-size:19px;background:var(--bg2);border-radius:10px;padding:16px;margin-bottom:14px;line-height:1.9">${esc(b.intro)}</div>`:''}
      ${b.toc.map(c=>`<div class="toc-item" onclick="openChapter(${b.id},${c.no})">${esc(c.title)}${c.brief?`<div style="font-size:15px;color:var(--muted);margin-top:3px">${esc(c.brief)}</div>`:''}</div>`).join('')||'<div class="err">暂无可读章节</div>'}`;
    window.scrollTo(0,0);
  }catch(e){ app.innerHTML='<div class="err">加载失败：'+e.message+'</div>'; }
}

// 模拟收银台
function startPay(bid, no, type, cents){
  const label = type==='buyout' ? '买断全本' : '解锁第 '+no+' 章';
  const el=document.createElement('div'); el.className='cashier'; el.id='cashier';
  el.innerHTML = `<div class="panel">
    <div style="font-size:20px;text-align:center;color:var(--muted)">${label}</div>
    <div class="amt">¥${(cents/100).toFixed(2)}</div>
    <div style="font-size:15px;color:var(--muted);text-align:center;margin-bottom:16px">内测模拟支付，不产生真实扣费</div>
    <div class="row">
      <button class="pay-btn ch" style="flex:1" onclick="closeCashier()">取消</button>
      <button class="pay-btn buy" style="flex:2" onclick="doPay(${bid},${no},'${type}')">确认支付</button>
    </div></div>`;
  document.body.appendChild(el);
}
function closeCashier(){ const e=document.getElementById('cashier'); if(e) e.remove(); }
async function doPay(bid, no, type){
  closeCashier(); showMask('支付中…');
  try{
    const idem = deviceId()+'-'+bid+'-'+type+'-'+(type==='chapter'?no:'full');
    const r1 = await fetch(API+'/orders',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({device_id:deviceId(),book_id:bid,order_type:type,chapter_no:type==='chapter'?no:null,idempotency_key:idem})});
    const j1 = await r1.json();
    if(j1.code!==0) throw new Error(j1.msg);
    const r2 = await fetch(API+'/orders/'+j1.data.order_id+'/mock-pay',{method:'POST'});
    const j2 = await r2.json();
    if(j2.code!==0) throw new Error(j2.msg);
    hideMask();
    openChapter(bid, no);  // 支付成功，重新加载本章
  }catch(e){ hideMask(); alert(e.message||'支付失败'); }
}

// 加载遮罩
function showMask(txt){  hideMask();
  const m=document.createElement('div'); m.className='mask'; m.id='mask';
  m.innerHTML=`<div class="spin"></div><div class="txt">${txt||'加载中…'}</div>`;
  document.body.appendChild(m);
}
function hideMask(){ const m=document.getElementById('mask'); if(m) m.remove(); }

// 章节阅读 + 听书
async function openChapter(bid,no){
  state.view='chapter'; stopAudio();
  showMask('正在翻到第 '+no+' 章…');
  try{
    const c = await api(`/books/${bid}/chapters/${no}?device_id=`+deviceId());
    state.chapter=c;
    document.getElementById('topTitle').textContent=state.book?state.book.title:'阅读';
    // 锁章：展示解锁页
    if(c.locked){
      hideMask();
      app.innerHTML = `
        <div class="chapter-title">${esc(c.title)}</div>
        <div class="lock-box">
          <div class="icon">🔒</div>
          <div class="tip">本章起为付费内容<br>前 ${c.free_chapters} 章已免费读完</div>
          <button class="pay-btn buy" onclick="startPay(${bid},${no},'buyout',${c.price_cents})">买断全本 ¥${(c.price_cents/100).toFixed(2)}</button>
          <button class="pay-btn ch" onclick="startPay(${bid},${no},'chapter',${c.chapter_price_cents})">仅解锁本章 ¥${(c.chapter_price_cents/100).toFixed(2)}</button>
        </div>
        <div class="bar">
          <button onclick="nav(-1)" ${c.has_prev?'':'disabled'}>‹ 上一章</button>
          <button onclick="showHome()">回首页</button>
        </div>`;
      return;
    }
    const paras = c.content.split(/\n+/).filter(p=>p.trim());
    const segs = c.tts_segments||[];
    app.innerHTML = `
      <div class="chapter-title">${esc(c.title)}</div>
      <div id="content">
        ${paras.map((p,i)=>`<p class="para" data-i="${i}">${esc(p)}</p>`).join('')}
      </div>
      <div class="interact" id="interact">
        <div class="q" id="iq">互动加载中…</div>
        <div id="iopts"></div>
        <div class="resp" id="resp" style="display:none"></div>
      </div>
      <div class="bar">
        <button onclick="nav(-1)" ${c.has_prev?'':'disabled'}>‹ 上一章</button>
        ${c.audio_url?`<button class="primary" id="playBtn" onclick="togglePlay()">▶ 听书</button>`
                     :`<button disabled>无音频</button>`}
        <button onclick="nav(1)" ${c.has_next?'':'disabled'}>下一章 ›</button>
      </div>
      ${c.audio_url?`<div class="bar" style="bottom:70px"><div class="speed" style="margin:0 auto">
        <button data-s="0.75" onclick="setSpeed(0.75,this)">0.75x</button>
        <button data-s="1.0" class="on" onclick="setSpeed(1.0,this)">1.0x</button>
        <button data-s="1.25" onclick="setSpeed(1.25,this)">1.25x</button>
      </div></div>`:''}
    `;
    window.scrollTo(0,0);
    if(c.audio_url) setupAudio(c);
    loadInteract(c.chapter_id);
    reportProgress(bid, no, 0);
    hideMask();
  }catch(e){ hideMask(); app.innerHTML='<div class="err">加载失败：'+e.message+'</div>'; }
}

// 互动：拉取真实节点（提问+选项）
async function loadInteract(chapterId){
  try{
    const n = await api('/interact/node/'+chapterId);
    document.getElementById('iq').textContent = n.question;
    document.getElementById('iopts').innerHTML = n.options.map((o,i)=>
      `<button class="opt" onclick="choose(${i})">${esc(o)}</button>`).join('');
    state.nodeReady = true;
  }catch(e){
    document.getElementById('iq').textContent = '互动加载失败，稍后再试';
  }
}
// 互动：选择后接 LLM 回响
async function choose(i){
  const r=document.getElementById('resp'); r.style.display='block';
  r.innerHTML='<span style="color:var(--muted)">正在为你接上剧情…</span>';
  document.querySelectorAll('#iopts .opt').forEach(b=>b.disabled=true);
  const t0=Date.now();
  try{
    const resp = await fetch(API+'/interact/choose',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({chapter_id:state.chapter.chapter_id, option_idx:i, is_rerun:false})});
    const j = await resp.json();
    if(j.code!==0) throw new Error(j.msg);
    r.textContent = j.data.echo;
  }catch(e){ r.textContent='回响生成失败：'+e.message; }
  document.querySelectorAll('#iopts .opt').forEach(b=>b.disabled=false);
}

function setupAudio(c){
  state.audio = new Audio(c.audio_url);
  state.audio.playbackRate = state.speed;
  state.audio.ontimeupdate = ()=>highlight(state.audio.currentTime*1000);
  state.audio.onended = ()=>{ state.playing=false; updatePlayBtn(); clearHl(); };
}
function togglePlay(){
  if(!state.audio) return;
  if(state.playing){ state.audio.pause(); state.playing=false; }
  else{ state.audio.play(); state.playing=true; }
  updatePlayBtn();
}
function updatePlayBtn(){ const b=document.getElementById('playBtn'); if(b) b.textContent = state.playing?'⏸ 暂停':'▶ 听书'; }
function setSpeed(s,btn){ state.speed=s; if(state.audio) state.audio.playbackRate=s; document.querySelectorAll('.speed button').forEach(b=>b.classList.remove('on')); btn.classList.add('on'); }
function stopAudio(){ if(state.audio){ state.audio.pause(); state.audio=null; } state.playing=false; state.segIdx=-1; }
function highlight(ms){
  const segs = state.chapter.tts_segments||[]; if(!segs.length) return;
  let idx=-1;
  for(let i=0;i<segs.length;i++){ if(ms>=segs[i].start_ms && ms<segs[i].end_ms){ idx=i; break; } }
  if(idx===state.segIdx) return; state.segIdx=idx;
  document.querySelectorAll('.para').forEach(p=>p.classList.remove('active'));
  if(idx>=0){ const el=document.querySelector(`.para[data-i="${idx}"]`); if(el){ el.classList.add('active'); el.scrollIntoView({block:'center',behavior:'smooth'}); } }
}
function clearHl(){ document.querySelectorAll('.para').forEach(p=>p.classList.remove('active')); }
function nav(d){ const c=state.chapter; openChapter(c.book_id, c.no+d); }
window.openBook=openBook; window.openChapter=openChapter; window.togglePlay=togglePlay; window.setSpeed=setSpeed; window.nav=nav; window.choose=choose; window.doSearch=doSearch; window.toggleMode=toggleMode; window.startPay=startPay; window.doPay=doPay; window.closeCashier=closeCashier;
applyMode();
showHome();
</script>
</body>
</html>
